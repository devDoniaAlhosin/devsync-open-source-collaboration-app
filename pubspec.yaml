name: devsync_open_source_collaboration_app
description: "DevSync — AI-powered developer collaboration platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.24
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^7.2.0
  shared_preferences: ^2.5.6
  app_links: ^7.2.2
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  equatable: ^2.0.7
  flutter_svg: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/png/devsync-app-icon.png
  adaptive_icon_background: "#0E2624"
  adaptive_icon_foreground: assets/brand/png/devsync-app-icon.png
  web:
    generate: true
    image_path: assets/brand/png/devsync-app-icon.png
    background_color: "#0E2624"
    theme_color: "#2EE0C8"
  windows:
    generate: true
    image_path: assets/brand/png/devsync-app-icon.png
  macos:
    generate: true
    image_path: assets/brand/png/devsync-app-icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/brand/png/
    - assets/brand/svg/
