name: devsync_open_source_collaboration_app
description: "DevSync — AI-powered developer collaboration platform."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  lucide_icons_flutter: ^4.0.1

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/brand/png/devsync-app-icon.png
  adaptive_icon_background: "#0E2624"
  adaptive_icon_foreground: assets/brand/png/devsync-app-icon.png
  web:
    generate: true
    image_path: assets/brand/png/devsync-app-icon.png
    background_color: "#0E2624"
    theme_color: "#2EE0C8"
  windows:
    generate: true
    image_path: assets/brand/png/devsync-app-icon.png
  macos:
    generate: true
    image_path: assets/brand/png/devsync-app-icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/brand/png/
